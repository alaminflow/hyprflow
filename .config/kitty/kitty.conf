# Kitty Configuration — TokyoNight Dark
shell /usr/bin/zsh

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window padding & opacity
window_padding_width 10
background_opacity 0.95

# TokyoNight Night Palette
foreground            #c0caf5
background            #1a1b26
selection_foreground   #c0caf5
selection_background   #33467c

# Cursor
cursor                #c0caf5
cursor_text_color     #1a1b26

# URL underline
url_color             #73daca

# Normal colors
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Bright colors
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
